# Retrieval eval set.
#
# Every expected path here was seen in real retrieval output while building
# the app, so the answers are grounded in this corpus rather than invented. A
# question passes when any expected path appears in the top-k hits.
#
# `type` filters the search the same way the agent's tools do: doc questions
# search documentation, code questions search code, and `any` searches both.

# Known miss. This file is 58 lines and mostly a mermaid diagram -- there are
# roughly two sentences of prose to embed, and it contains the word "deploy"
# zero times. The competing hits are real architecture docs. Fixing this needs
# diagram descriptions generated at index time, which costs an LLM call per
# diagram. Left in as a standing reminder of what the index cannot see.
