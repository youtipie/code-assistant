# Retrieval eval set: 171 questions, each with the path or paths that answer it.
# A question passes when any expected path appears in the top-k hits. `type`
# filters the search the same way the agent's tools do: doc questions search
# documentation, code questions search code, `any` searches both.
#
# Two provenances, deliberately mixed into one set:
#
#   - 25 written by hand, whose expected paths were all seen in real retrieval
#     output while building the app. Realistically phrased, and selected by the
#     thing they score -- they catch a regression, they cannot measure what
#     search never surfaced in the first place.
#   - 146 drafted the opposite way round: sample a file round-robin across the
#     corpus directories, show it to a model, ask what question that file
#     answers, never consult retrieval. Those can contain questions search
#     loses, and on their first run three of them did.
#
# Known misses are kept and annotated rather than tuned away -- the comment over
# each says what it costs and why it is still here. A path is in `expect`
# because someone read the file and it answers the question, never because
# search ranked it.

